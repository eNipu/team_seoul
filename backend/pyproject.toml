[project]
name = "heldly"
version = "0.1.0"
description = "Heldly MCP server: ChatGPT-native AI social companion"
authors = [
    { name = "gururise", email = "ruebsamen.gene@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3",
    "openai>=3.57.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
