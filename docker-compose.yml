services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heldly
      POSTGRES_PASSWORD: heldly
      POSTGRES_DB: heldly
    ports:
      - "${HELDLY_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heldly"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://heldly:heldly@db:5432/heldly
    ports:
      - "${HELDLY_PORT:-8000}:8000"

volumes:
  pgdata:
