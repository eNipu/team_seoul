services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: venn
      POSTGRES_PASSWORD: venn
      POSTGRES_DB: venn
    ports:
      - "${VENN_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venn"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://venn:venn@db:5432/venn
    ports:
      - "${VENN_PORT:-8081}:8081"

volumes:
  pgdata:
